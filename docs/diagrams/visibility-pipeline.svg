<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6ef"/><stop offset="0.55" stop-color="#fdeef6"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a52"/><stop offset="0.5" stop-color="#c061f0"/><stop offset="1" stop-color="#f7a8e6"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5a64"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a2a4a" flood-opacity="0.12"/></filter></defs>
<rect width="1280" height="700" rx="22" fill="url(#bg)"/>
<rect x="40" y="34" width="46" height="6" rx="3" fill="url(#hl)"/>
<text x="40" y="76" font-size="26" font-weight="700" fill="#2a1620" text-anchor="start">How visibility is measured</text>
<text x="40" y="102" font-size="15" font-weight="400" fill="#6b5a64" text-anchor="start">Each query becomes a prompt; the answer is parsed for links, and the target is searched for in order.</text>
<rect x="40" y="150" width="200" height="96" rx="14" fill="#ffffff" stroke="#ff9a52" stroke-width="1.6" filter="url(#sh)"/>
<rect x="40" y="150" width="7" height="96" rx="3" fill="#ff9a52"/>
<text x="60" y="176" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Queries</text>
<text x="60" y="196" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">selected + added by hand</text>
<rect x="280" y="150" width="200" height="96" rx="14" fill="#ffffff" stroke="#ff9a52" stroke-width="1.6" filter="url(#sh)"/>
<rect x="280" y="150" width="7" height="96" rx="3" fill="#ff9a52"/>
<text x="300" y="176" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Prompt</text>
<text x="300" y="196" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">query + geo / language</text>
<rect x="520" y="150" width="200" height="96" rx="14" fill="#ffffff" stroke="#78a8f0" stroke-width="1.6" filter="url(#sh)"/>
<rect x="520" y="150" width="7" height="96" rx="3" fill="#78a8f0"/>
<text x="540" y="176" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Language model</text>
<text x="540" y="196" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">answer text with sources</text>
<rect x="760" y="150" width="200" height="96" rx="14" fill="#ffffff" stroke="#b18cf0" stroke-width="1.6" filter="url(#sh)"/>
<rect x="760" y="150" width="7" height="96" rx="3" fill="#b18cf0"/>
<text x="780" y="176" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Extract URLs</text>
<text x="780" y="196" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">links, bare domains, no utm</text>
<rect x="1000" y="150" width="240" height="176" rx="14" fill="#ffffff" stroke="#f08cc4" stroke-width="1.6" filter="url(#sh)"/>
<rect x="1000" y="150" width="7" height="176" rx="3" fill="#f08cc4"/>
<text x="1020" y="176" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Find the target</text>
<text x="1020" y="196" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">first citation that matches:</text>
<text x="1020" y="214" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">1  exact URL</text>
<text x="1020" y="231" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">2  URL prefix (a page of the site)</text>
<text x="1020" y="248" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">3  registered domain</text>
<text x="1020" y="265" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">4  brand name in URL or title</text>
<path d="M240 198 L280 198" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M480 198 L520 198" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M720 198 L760 198" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M960 198 L1000 198" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40" y="410" width="330" height="120" rx="14" fill="#ffffff" stroke="#6cc58a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="40" y="410" width="7" height="120" rx="3" fill="#6cc58a"/>
<text x="60" y="436" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Per query</text>
<text x="60" y="456" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">position = rank of the first match</text>
<text x="60" y="474" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">score = 100 / position, 0 if not found</text>
<rect x="410" y="410" width="330" height="120" rx="14" fill="#ffffff" stroke="#6cc58a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="410" y="410" width="7" height="120" rx="3" fill="#6cc58a"/>
<text x="430" y="436" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Per project</text>
<text x="430" y="456" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">visibility = matched / answered</text>
<text x="430" y="474" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">average position = mean of matched</text>
<rect x="780" y="410" width="190" height="120" rx="14" fill="#ffffff" stroke="#6cc58a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="780" y="410" width="7" height="120" rx="3" fill="#6cc58a"/>
<text x="800" y="436" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Daily snapshot</text>
<text x="800" y="456" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">one row per day</text>
<text x="800" y="474" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">stored in PostgreSQL</text>
<rect x="1010" y="410" width="230" height="120" rx="14" fill="#ffffff" stroke="#78a8f0" stroke-width="1.6" filter="url(#sh)"/>
<rect x="1010" y="410" width="7" height="120" rx="3" fill="#78a8f0"/>
<text x="1030" y="436" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">Charts</text>
<text x="1030" y="456" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">up to 14 days of history</text>
<text x="1030" y="474" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">delta = today − yesterday</text>
<path d="M1120 326 V366 H205 V410" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M370 470 L410 470" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M740 470 L780 470" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M970 470 L1010 470" fill="none" stroke="#6b5a64" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40" y="565" width="1200" height="110" rx="18" fill="#f4f1f3" fill-opacity="0.55" stroke="#c2b6bd" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="58" y="593" font-size="12" font-weight="700" fill="#6b5a64" text-anchor="start">EXAMPLE</text>
<text x="60" y="615" font-size="15" font-weight="400" fill="#2a1620" text-anchor="start">6 queries are asked, 5 mention acmepay.io (positions 1, 3, 2, 1 and 1)  →  visibility 5 / 6 = 83.3 %</text>
<text x="60" y="643" font-size="15" font-weight="400" fill="#2a1620" text-anchor="start">Average position (1 + 3 + 2 + 1 + 1) / 5 = 1.6  ·  the query where it is missing scores 0 %.</text>
</svg>
