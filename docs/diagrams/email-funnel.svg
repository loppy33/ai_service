<text x="795" y="308" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">Short SEO brief form</text>
<text x="795" y="326" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">newsletter</text>
<circle cx="1130" cy="230" r="9" fill="#ffffff" stroke="#6cc58a" stroke-width="4"/>
<text x="1130" y="200" font-size="15" font-weight="700" fill="#2a1620" text-anchor="middle">Day 23</text>
<rect x="1025" y="262" width="210" height="100" rx="14" fill="#ffffff" stroke="#6cc58a" stroke-width="1.6" filter="url(#sh)"/>
