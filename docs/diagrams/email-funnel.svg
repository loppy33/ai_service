<text x="275" y="288" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">REMIND_2D</text>
<text x="275" y="308" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">Help choosing a plan</text>
<text x="275" y="326" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">only if logged in and not paid</text>
<circle cx="620" cy="230" r="9" fill="#ffffff" stroke="#b18cf0" stroke-width="4"/>
