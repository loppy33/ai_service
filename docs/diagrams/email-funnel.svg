<text x="35" y="288" font-size="15" font-weight="700" fill="#2a1620" text-anchor="start">REPORT</text>
<text x="35" y="308" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">Report and cabinet link</text>
<text x="35" y="326" font-size="12.5" font-weight="400" fill="#6b5a64" text-anchor="start">always</text>
