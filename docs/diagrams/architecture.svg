<text x="40" y="76" font-size="26" font-weight="700" fill="#2a1620" text-anchor="start">System architecture</text>
<text x="40" y="102" font-size="15" font-weight="400" fill="#6b5a64" text-anchor="start">A React SPA talks to a FastAPI backend that queries AI sources, stores results in PostgreSQL and sends emails.</text>
