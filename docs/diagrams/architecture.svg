<text x="918" y="668" font-size="13" font-weight="400" fill="#2a1620" text-anchor="start">Wakes up every 60 s, sends due emails</text>
<text x="918" y="690" font-size="13" font-weight="400" fill="#2a1620" text-anchor="start">from email_queue, retries up to 5 times.</text>
<text x="918" y="722" font-size="12" font-weight="400" fill="#6b5a64" text-anchor="start">Pauses on provider 401 / 403 / 429.</text>
